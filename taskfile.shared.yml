version: '3'

tasks:
  build:
    desc: Build the {{.BIN_NAME}} indicator binary
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o .bin/{{.BIN_NAME}} cmd/main.go && chmod +x .bin/{{.BIN_NAME}}

  preview:
    desc: Build and preview the {{.BIN_NAME}} indicator JSON output
    cmds:
      - task: build
      - .bin/{{.BIN_NAME}} | jq .

  prod:
    desc: Build and install the {{.BIN_NAME}} indicator into Waybar scripts
    cmds:
      - task: build
      - mkdir -p ~/.config/waybar/scripts/
      - \cp -f .bin/{{.BIN_NAME}} ~/.config/waybar/scripts

  remove-db:
    desc: Remove the {{.BIN_NAME}} history database
    cmds:
      - |
        case "$XDG_STATE_HOME" in
          /*) state_home="$XDG_STATE_HOME" ;;
          *) state_home="$HOME/.local/state" ;;
        esac
        db="$state_home/bar-indicators/{{.BIN_NAME}}_history.sqlite3"
        rm -f -- "$db" "$db-wal" "$db-shm" "$db-journal"

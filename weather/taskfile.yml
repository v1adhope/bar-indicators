version: '3'

env:
  BIN_NAME: weather

includes:
  shared:
    taskfile: ../taskfile.shared.yml
    flatten: true

tasks:
  remove-db:
    desc: Remove the weather history database
    cmds:
      - |
        case "$XDG_STATE_HOME" in
          /*) state_home="$XDG_STATE_HOME" ;;
          *) state_home="$HOME/.local/state" ;;
        esac
        db="$state_home/bar-indicators/weather_history.sqlite3"
        rm -f -- "$db" "$db-wal" "$db-shm" "$db-journal"

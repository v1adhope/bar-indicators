version: '3'

tasks:
  build:
    cmds:
      - go build -o .bin/cryptocurrency cmd/main.go && chmod +x .bin/cryptocurrency

  preview:
    cmds:
      - task: build
      - .bin/cryptocurrency | jq .

  prod:
    cmds:
      - task: build
      - mkdir -p ~/.config/waybar/scripts/
      - \cp -f .bin/cryptocurrency ~/.config/waybar/scripts
